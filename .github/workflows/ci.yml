name: CI

on:
  push:
    branches:
      - work
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Maven reactor
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out project and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: chess-frontend/package-lock.json

      - name: Enforce source-file size limit
        run: bash scripts/check-source-size.sh

      - name: Build and test
        run: mvn -B -ntp clean install

      - name: Enforce frontend orchestration coverage
        working-directory: chess-frontend
        run: npm run test:coverage

      - name: Report Java coverage
        shell: bash
        run: |
          set -euo pipefail
          for module in chess chess-database chess-api; do
            report="$module/target/site/jacoco/jacoco.csv"
            if [[ ! -f "$report" ]]; then
              echo "::error::Missing JaCoCo report for $module"
              exit 1
            fi

            case "$module" in
              chess)
                min_line=74
                min_branch=62
                ;;
              chess-database)
                min_line=87
                min_branch=64
                ;;
              chess-api)
                min_line=54
                min_branch=44
                ;;
            esac

            awk -F, -v module="$module" -v min_line="$min_line" -v min_branch="$min_branch" '
              NR > 1 {
                line_missed += $8
                line_covered += $9
                branch_missed += $6
                branch_covered += $7
              }
              END {
                line_total = line_missed + line_covered
                branch_total = branch_missed + branch_covered
                line_pct = line_total ? (100.0 * line_covered / line_total) : 100.0
                branch_pct = branch_total ? (100.0 * branch_covered / branch_total) : 100.0
                printf "%s: line coverage %.2f%% (%d/%d), branch coverage %.2f%% (%d/%d)\n",
                  module, line_pct, line_covered, line_total,
                  branch_pct, branch_covered, branch_total
                if (line_pct < min_line || branch_pct < min_branch) {
                  printf "Coverage regression in %s: required line >= %.2f%% and branch >= %.2f%%\n",
                    module, min_line, min_branch > "/dev/stderr"
                  exit 2
                }
              }
            ' "$report"
          done
