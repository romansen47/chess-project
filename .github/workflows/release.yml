name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out tagged project and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify tag commit belongs to master
        shell: bash
        run: |
          git fetch origin master --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Release tags must point to a commit contained in master."
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v5
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: chess-frontend/package-lock.json

      - name: Build and test
        run: mvn -B -ntp clean install

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          STOCKFISH_VERSION="19.0.0"
          STOCKFISH_SOURCE_ARCHIVE="stockfish.js-v${STOCKFISH_VERSION}-source.tar.gz"
          STOCKFISH_SOURCE_URL="https://github.com/nmrugg/stockfish.js/archive/refs/tags/v${STOCKFISH_VERSION}.tar.gz"

          mkdir -p dist
          cp chess-api/target/chess-app.jar "dist/cat-${GITHUB_REF_NAME}.jar"
          cp LICENSE dist/LICENSE

          curl --fail --location --retry 3 \
            --output "dist/${STOCKFISH_SOURCE_ARCHIVE}" \
            "${STOCKFISH_SOURCE_URL}"

          # Fail the release before publication if the mirrored source archive
          # is not a readable tar.gz file.
          tar -tzf "dist/${STOCKFISH_SOURCE_ARCHIVE}" >/dev/null

          (
            cd dist
            sha256sum "cat-${GITHUB_REF_NAME}.jar" > "cat-${GITHUB_REF_NAME}.jar.sha256"
            sha256sum "${STOCKFISH_SOURCE_ARCHIVE}" > "${STOCKFISH_SOURCE_ARCHIVE}.sha256"
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/cat-${GITHUB_REF_NAME}.jar" \
            "dist/cat-${GITHUB_REF_NAME}.jar.sha256" \
            "dist/stockfish.js-v19.0.0-source.tar.gz" \
            "dist/stockfish.js-v19.0.0-source.tar.gz.sha256" \
            "dist/LICENSE" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "CAT $GITHUB_REF_NAME" \
            --generate-notes
